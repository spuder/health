services:
  health:
    build: .
    # image: forgejo.snowy-vibes.ts.net/spencer/health:latest
    container_name: health
    # ports:
    #   - "3001:3001"
    volumes:
      - /mnt/NVMe/Docker/health:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    dns:
      - 100.100.100.100 # Tailscale MagicDNS — pinned so a redeploy can't silently bake in a bad DNS snapshot
      - 1.1.1.1 # fallback if Tailscale DNS is briefly unavailable
    restart: unless-stopped
    labels:
      - "docktail.service.enable=true"
      - "docktail.service.name=health"
      - "docktail.service.port=3001"
      - "docktail.service.service-port=443"
